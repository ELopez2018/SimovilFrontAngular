<div class="col-sm-12 p-2">
  <div class="form-row">

    <div class="col-sm-3 mb-1">
      <label for="paramSel" style="font-weight: bold;">Reporte</label>
      <select (change)="changeReport(); getBoolean();" name="paramSel" class="form-control" [(ngModel)]="paramSel">
        @for (item of treeParams; track item) {
          <option [ngValue]="item">
            {{ item.text }}
          </option>
        }
      </select>
    </div>

    @if (edsBoolean) {
      <div class="col-sm-2 mb-1">
        <div class="form-group form-row">
          <label class="control-label display-block" style="font-weight: bold;">Estación</label>
          <select class="form-control display-block" [(ngModel)]="stationSel">
            @for (item of stations; track item) {
              <option [ngValue]="item">
                {{ item.nombreEstacion }}
              </option>
            }
          </select>
        </div>
      </div>
    }

    @if (fechaSinceBoolean) {
      <div class="col-sm-2 mb-1">
        <label style="font-weight: bold;">Fecha desde</label>
        <input type="date" class="form-control" [(ngModel)]="dateIni">
      </div>
    }

    @if (fechaToBoolean) {
      <div class="col-sm-2 mb-1">
        <label style="font-weight: bold;">Fecha hasta</label>
        <input type="date" class="form-control" [(ngModel)]="dateEnd">
      </div>
    }

    <div class="col-sm-2 mb-1">
      <button id="btnSearchCartera" (click)="getReport(prueba)" class="btn btn-block btn-sm btn-primary text-truncate">
        <i class="fas fa-search fa-fw"></i>&nbsp;Consultar</button>
        <button (click)="clear()" class="btn btn-block btn-sm btn-danger text-truncate">
          <i class="fas fa-eraser"></i>&nbsp;Limpiar</button>
        </div>

      </div>
    </div>

    <app-report-ssrs #target [show]="showReport" [https]="true" serverReport="simovil.mileniumgas.com:1451/ReportsServer" [urlReport]="nameReport" [parameters]="params" [width]="widthReport" [showParameter]="false">
    </app-report-ssrs>


    <div #prueba></div>
