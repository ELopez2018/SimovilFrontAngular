<div class="col-sm-12 p-2">
  <div class="form-row">
    <div class="col-sm-3 mb-1">
      <label for="paramSel" class="label label-default">
      Reporte</label>
      <select (change)="changeReport(); getElementos()" name="paramSel" class="form-control" [(ngModel)]="paramSel">
        @for (item of treeParams; track item) {
          <option [ngValue]="item">{{item.text}}</option>
        }
      </select>
    </div>

    @if (deTipoCupo) {
      <div class="col-sm-1 mb-1">
        <label for="type">Tipo Cliente</label>
        <select id="type" class="form-control" [(ngModel)]="tipoCupoSel" (change)="activeEstacion();">
          @for (item of tipoCupos; track item) {
            <option [ngValue]="item">{{item.detalleTipoCupo}}</option>
          }
        </select>
      </div>
    }

    <!--
    <div class="col-sm mb-1">
      <label for="nit">Nit cliente</label>
      <input type="number" id="nit" class="form-control" [(ngModel)]="nit">
    </div>
    -->

    @if (deEstacion) {
      <div class="col-sm-2 mb-1">
        <div class="form-group form-row">
          <label class="control-label display-block">Estación</label>
          <select class="form-control display-block" [(ngModel)]="stationSel" (change)="getTipoEstacion()" (change)="getClientesDeCartera()">
            @for (item of stations; track item) {
              <option [ngValue]="item">
                {{ item.nombreEstacion }}
              </option>
            }
          </select>
        </div>
      </div>
    }

    @if (deTipoEstacion) {
      <div class="col-sm-1 mb-1">
        <label for="type">Tipo</label>
        <select id="type" class="form-control" [(ngModel)]="tipoEstacionSeleccionada">
          @for (item of tipoDeEstaciones; track item) {
            <option [ngValue]="item">{{item.detalleTipoEstacion}}</option>
          }
        </select>
      </div>
    }

    @if (porTipoClientes) {
      <div class="col-sm-2 mb-1">
        <label class="control-label">Cliente</label>
        <div class="input-group">
          <select class="form-control" [(ngModel)]="clienteSelCartera">
            @for (cliente of clientesDeCartera; track cliente) {
              <option [ngValue]="cliente">
                {{ cliente.nombre }}
              </option>
            }
          </select>
        </div>
      </div>
    }

    @if (deAnyo) {
      <div class="col-sm-1 mb-1">
        <label for="dateini">Año</label>
        <select name="paramAnyo" class="form-control" [(ngModel)]="paramAnyo">
          @for (itemAnual of anyos; track itemAnual) {
            <option [ngValue]="itemAnual">{{itemAnual.detalleAnyo}}</option>
          }
        </select>
      </div>
    }

    @if (deDesde) {
      <div class="col-sm-2 mb-1">
        <label for="dateini">Desde</label>
        <input type="date" id="dateini" [(ngModel)]="dateIni" class="form-control">
      </div>
    }

    @if (deHasta) {
      <div class="col-sm-2 mb-1">
        <label for="datefin">Hasta</label>
        <input type="date" id="datefin" [(ngModel)]="dateEnd" class="form-control">
      </div>
    }

    <div class="col-sm-2 mb-1">
      <button id="btnSearchCartera" (click)="getReport(prueba)" class="btn btn-block btn-sm btn-primary text-truncate">
        <i class="fas fa-search fa-fw"></i>&nbsp;Consultar</button>
        <button (click)="clear()" class="btn btn-block btn-sm btn-danger text-truncate">
          <i class="fas fa-eraser"></i>&nbsp;Limpiar</button>
        </div>

      </div>
    </div>

    <app-report-ssrs #target [show]="showReport" [https]="true" serverReport="simovil.mileniumgas.com:1451/ReportsServer" [urlReport]="nameReport" [parameters]="params" [width]="widthReport" [showParameter]="false">
    </app-report-ssrs>


    <div #prueba></div>
