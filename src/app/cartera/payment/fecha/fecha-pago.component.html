<div class='row'>
    <div class='col-md-12'>
        <h5 class='mt-2 mb-2 fila_titulo'>
            Actualizar fecha del pago
        </h5>
    </div>
</div>

<div class='card color_tabla'>
    <div class='card-header'>
        <div class='row mt-2'>
            <div class='col-md-1'></div>
            <div class='col-md-2'>
                <span style='font-family: cursive; font-weight: bold;'>id pago:<img src='../../../../assets/img/alerta7.gif'></span>
            </div>
            <div class='col-md-2'>
                <input type='text' class='form-control' placeholder='{{ id_pago }}' readonly>
            </div>
            <div class='col-md-2'>
                <span style='font-family: cursive; font-weight: bold;'>nueva Fecha Pago: <img *ngIf='!nuevaFechaPago' src='../../../assets/img/alerta2.gif'> <img *ngIf='nuevaFechaPago' src='../../../assets/img/alerta7.gif'></span>
            </div>
            <div class='col-md-3'>
                <input [(ngModel)]="nuevaFechaPago" type='date' class='form-control'>
            </div>
            <div class='col-md-2'>
                <button type='button' class='boton' (click)="updateFechaPago(id_pago, nuevaFechaPago);">Actualizar</button>
            </div>
        </div>
    </div>
</div>
