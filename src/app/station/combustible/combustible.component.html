<div class='row'>
  <div class='col-md-12'>
    <h5 class='mt-2 mb-2 titulo'>
      Actualizar el tipo de combustible
    </h5>
  </div>
</div>

<div class='card color_tabla'>
  <div class='card-header'>
    <div class='row mt-2'>
      <div class='col-md-2'></div>
      <div class='col-md-2'>
        <span style='font-family: cursive; font-weight: bold;'>id consumo:<img src='../../../assets/img/alerta7.gif'></span>
        <input type='text' class='form-control' placeholder='{{ idConsumo }}' readonly>
      </div>
      <div class="col-md-2">
        <span style="font-family: cursive; font-weight: bold;">Combustible</span>
        <input type="number" class="form-control" [(ngModel)]="articulo" placeholder='{{articulo}}'>
      </div>
      <div class='col-md-3'>
        <span style='font-family: cursive; font-weight: bold;'>Actualizar Combustible: {{idArticulo}}
          @if (!idArticulo) {
            <img src='../../../assets/img/alerta2.gif'>
            } @if (idArticulo) {
            <img src='../../../assets/img/alerta7.gif'>
          }
        </span>
        <select name="combustible" [(ngModel)]="idArticulo" class='form-control'>
          @for (pro of articles; track pro) {
            <option [ngValue]="pro.ID">{{pro.DESCRIPCION}}</option>
          }
        </select>
      </div>
      <div class='col-md-2' style="text-align: center;">
        <div class='col-md-1'></div>
        <br>
          <button type='button' class='boton' (click)="updateCombustible(idConsumo, idArticulo)">Actualizar</button>
        </div>
      </div>
    </div>
  </div>
