<div class='row'>
  <div class='col-md-12'>
    <h5 class='mt-2 mb-2 titulo'>
      Actualizar fecha del consumo
    </h5>
  </div>
</div>

<div class='card color_tabla'>
  <div class='card-header'>
    <div class='row mt-2'>
      <div class='col-md-1'></div>
      <div class='col-md-2'>
        <span style='font-family: cursive; font-weight: bold;'>id consumo:<img src='../../../assets/img/alerta7.gif'></span>
      </div>
      <div class='col-md-2'>
        <input type='text' class='form-control' placeholder='{{ idConsumo }}' readonly>
      </div>
      <div class='col-md-2'>
        <span style='font-family: cursive; font-weight: bold;'>nueva Fecha Consumo: @if (!nuevaFechaConsumo) {
          <img src='../../../assets/img/alerta2.gif'>
          } @if (nuevaFechaConsumo) {
          <img src='../../../assets/img/alerta7.gif'>
        }</span>
      </div>
      <div class='col-md-3'>
        <input [(ngModel)]="nuevaFechaConsumo" type='date' class='form-control'>
      </div>
      <div class='col-md-2'>
        <button type='button' class='boton' (click)="updateFechaConsumo(idConsumo, nuevaFechaConsumo)">Actualizar</button>
      </div>
    </div>
  </div>
</div>
